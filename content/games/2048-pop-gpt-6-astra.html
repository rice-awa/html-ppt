<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f0">
  <title>2048 POP / 合合乐</title>
  <style>
    :root {
      --paper: #f4f5f0;
      --ink: #232824;
      --muted: #788078;
      --line: #d7dbd3;
      --line-strong: #b9c0b7;
      --blue: #2758df;
      --blue-dark: #1b3ca2;
      --lime: #dff36d;
      --coral: #ee7666;
      --violet: #b6a8ef;
      --card: #ffffff;
      --board: #dfe3da;
      --cell: #cbd1c7;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--ink);
      background: var(--paper);
      font-family: "Avenir Next", Avenir, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
    }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

    .shell {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 28px 0 34px;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      text-decoration: none;
      font-size: 13px;
      font-weight: 850;
      letter-spacing: .07em;
    }
    .brand-mark {
      display: grid;
      grid-template-columns: repeat(2, 9px);
      gap: 3px;
      width: 21px;
      height: 21px;
      padding: 1px;
      transform: rotate(-8deg);
    }
    .brand-mark i { display: block; border-radius: 3px; }
    .brand-mark i:nth-child(1) { background: var(--blue); }
    .brand-mark i:nth-child(2) { background: var(--coral); }
    .brand-mark i:nth-child(3) { background: var(--lime); }
    .brand-mark i:nth-child(4) { background: var(--violet); }
    .top-meta {
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .top-meta span:first-child { color: var(--blue); }

    .game-layout {
      display: grid;
      grid-template-columns: 206px minmax(390px, 472px) 206px;
      align-items: start;
      justify-content: center;
      gap: clamp(34px, 6vw, 88px);
      padding: 76px 0 56px;
    }
    .intro { padding-top: 8px; }
    .kicker, .panel-kicker {
      margin: 0 0 17px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .intro h1 {
      margin: 0;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      font-size: clamp(82px, 9vw, 116px);
      font-weight: 900;
      line-height: .76;
      letter-spacing: -.045em;
    }
    .intro h1 span { display: block; color: var(--blue); }
    .intro h1 span:first-child { color: var(--ink); }
    .tagline {
      margin: 30px 0 0;
      font-size: 20px;
      font-weight: 850;
      letter-spacing: -.035em;
    }
    .intro-copy {
      max-width: 168px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }
    .intro-rule {
      width: 42px;
      height: 4px;
      margin-top: 42px;
      background: var(--coral);
    }

    .play-column { min-width: 0; }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 17px;
    }
    .score-group { display: flex; gap: 8px; }
    .score-box {
      min-width: 100px;
      padding: 11px 14px 10px;
      border: 1px solid var(--line-strong);
      background: var(--card);
    }
    .score-label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .score-value {
      display: block;
      margin-top: 2px;
      font-family: "Arial Black", Impact, sans-serif;
      font-size: 23px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .score-box.best .score-value { color: var(--blue); }
    .gain {
      position: absolute;
      transform: translateY(-26px);
      color: var(--blue);
      font-size: 13px;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
    }
    .gain.show { animation: gainUp .72s var(--ease-out) both; }
    @keyframes gainUp { 0% { opacity: 0; transform: translateY(-8px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-32px); } }

    .board-wrap { position: relative; }
    .board {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: var(--board);
      box-shadow: 12px 14px 0 #c8cec4;
      touch-action: none;
      user-select: none;
    }
    .board::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .24;
      background-image: linear-gradient(135deg, rgba(255,255,255,.4) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.4) 50%, rgba(255,255,255,.4) 75%, transparent 75%);
      background-size: 8px 8px;
      pointer-events: none;
    }
    .grid {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template: repeat(4, 1fr) / repeat(4, 1fr);
      gap: 2.5%;
      padding: 3.5%;
    }
    .cell {
      border-radius: 3px;
      background: var(--cell);
      box-shadow: inset 0 2px 0 rgba(35,40,36,.07);
    }
    .tile-layer { position: absolute; inset: 0; z-index: 2; }
    .tile {
      position: absolute;
      left: 3.5%;
      top: 3.5%;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 21.375%;
      height: 21.375%;
      border-radius: 3px;
      color: var(--ink);
      font-family: "Arial Black", Impact, sans-serif;
      font-size: clamp(23px, 5.8vw, 43px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -.06em;
      font-variant-numeric: tabular-nums;
      transform: translate(calc(var(--x) * 111.7%), calc(var(--y) * 111.7%));
      transition: transform 130ms var(--ease-in-out), background-color 130ms ease, color 130ms ease, box-shadow 130ms ease;
      will-change: transform;
    }
    .tile.tile--new { animation: tileIn 190ms var(--ease-out) both; }
    .tile.tile--merged { animation: tilePop 220ms var(--ease-out) both; z-index: 4; }
    @keyframes tileIn { from { opacity: 0; transform: translate(calc(var(--x) * 111.7%), calc(var(--y) * 111.7%)) scale(.76); } to { opacity: 1; transform: translate(calc(var(--x) * 111.7%), calc(var(--y) * 111.7%)) scale(1); } }
    @keyframes tilePop { 0% { transform: translate(calc(var(--x) * 111.7%), calc(var(--y) * 111.7%)) scale(1); } 45% { transform: translate(calc(var(--x) * 111.7%), calc(var(--y) * 111.7%)) scale(1.12); } 100% { transform: translate(calc(var(--x) * 111.7%), calc(var(--y) * 111.7%)) scale(1); } }
    .tile[data-value="2"] { background: #ffffff; }
    .tile[data-value="4"] { background: #eef3cf; }
    .tile[data-value="8"] { background: var(--lime); }
    .tile[data-value="16"] { background: #c3e95a; }
    .tile[data-value="32"] { background: #f5b768; }
    .tile[data-value="64"] { background: var(--coral); color: #fff; }
    .tile[data-value="128"] { background: #de6a96; color: #fff; }
    .tile[data-value="256"] { background: var(--violet); }
    .tile[data-value="512"] { background: #7665d7; color: #fff; }
    .tile[data-value="1024"] { background: var(--blue); color: #fff; font-size: clamp(18px, 4.8vw, 35px); }
    .tile[data-value="2048"] { background: var(--ink); color: var(--lime); font-size: clamp(18px, 4.8vw, 35px); box-shadow: 0 0 0 4px var(--lime), 0 0 0 6px var(--ink); }
    .tile[data-value="4096"], .tile[data-value="8192"] { background: #111; color: #fff; font-size: clamp(16px, 4.3vw, 31px); }
    .board-note {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 16px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .board-note strong { color: var(--ink); }
    .status-dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--coral); vertical-align: 1px; }
    .controls { display: flex; gap: 8px; }
    .icon-btn, .restart-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 3px;
      color: var(--ink);
      background: var(--card);
      cursor: pointer;
      transition: transform 140ms var(--ease-out), background-color 140ms ease, color 140ms ease, border-color 140ms ease;
    }
    .icon-btn { width: 38px; }
    .icon-btn:hover, .restart-btn:hover { background: var(--ink); border-color: var(--ink); color: #fff; transform: translateY(-2px); }
    .icon-btn:active, .restart-btn:active { transform: translateY(1px); }
    .icon-btn:disabled { opacity: .42; cursor: not-allowed; transform: none; }
    .icon-btn svg, .restart-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .restart-btn { gap: 8px; padding: 0 13px; font-size: 12px; font-weight: 850; }

    .side-panel { padding-top: 10px; }
    .panel-kicker { color: var(--muted); }
    .target-line {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .target-tile {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 54px;
      height: 54px;
      border-radius: 3px;
      color: var(--lime);
      background: var(--ink);
      box-shadow: 4px 4px 0 var(--lime);
      font-family: "Arial Black", Impact, sans-serif;
      font-size: 16px;
      font-weight: 900;
    }
    .target-copy strong { display: block; font-size: 14px; }
    .target-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .progress-block { padding: 17px 0 22px; border-bottom: 1px solid var(--line); }
    .progress-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 11px; font-weight: 800; }
    .progress-head span { color: var(--muted); font-variant-numeric: tabular-nums; }
    .progress-track { height: 6px; margin-top: 10px; overflow: hidden; background: var(--line); }
    .progress-fill { width: 0; height: 100%; background: var(--blue); transition: width 240ms var(--ease-out); }
    .streak { padding: 18px 0 21px; border-bottom: 1px solid var(--line); }
    .streak-row { display: flex; justify-content: space-between; align-items: center; }
    .streak-label { color: var(--muted); font-size: 11px; font-weight: 800; }
    .streak-value { color: var(--coral); font-family: "Arial Black", Impact, sans-serif; font-size: 28px; line-height: 1; }
    .streak-bar { display: flex; gap: 4px; margin-top: 12px; }
    .streak-bar i { flex: 1; height: 5px; background: var(--line); }
    .streak-bar i.on { background: var(--coral); }
    .collection { padding-top: 18px; }
    .collection-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 11px; }
    .collection-title strong { font-size: 11px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .collection-title span { color: var(--muted); font-size: 10px; font-weight: 800; }
    .milestones { display: flex; flex-wrap: wrap; gap: 5px; }
    .milestone {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 31px;
      height: 27px;
      border: 1px solid var(--line);
      color: #aab0a9;
      background: transparent;
      font-family: "Arial Black", Impact, sans-serif;
      font-size: 9px;
      font-weight: 900;
    }
    .milestone.unlocked { border-color: var(--ink); color: var(--ink); background: var(--lime); }
    .milestone.current { border-color: var(--blue); color: #fff; background: var(--blue); }

    .footer-line {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
    }
    .footer-line span:last-child { text-align: right; }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 30px;
      background: rgba(244,245,240,.9);
      backdrop-filter: blur(5px);
      opacity: 1;
      transition: opacity 160ms ease;
    }
    .overlay[hidden] { display: none; }
    .overlay-card { width: min(100%, 260px); text-align: center; }
    .overlay-mark { width: 39px; height: 39px; margin: 0 auto 16px; border: 5px solid var(--blue); background: var(--lime); transform: rotate(8deg); }
    .overlay h2 { margin: 0; font-family: "Arial Black", Impact, sans-serif; font-size: 31px; line-height: 1; letter-spacing: -.04em; }
    .overlay p { margin: 10px 0 19px; color: var(--muted); font-size: 13px; font-weight: 650; }
    .overlay-actions { display: flex; justify-content: center; gap: 8px; }
    .overlay-actions button { min-height: 38px; padding: 0 15px; border: 1px solid var(--ink); border-radius: 3px; cursor: pointer; font-size: 12px; font-weight: 850; }
    .overlay-actions .primary { color: #fff; background: var(--ink); }
    .overlay-actions .secondary { color: var(--ink); background: #fff; }

    @media (max-width: 980px) {
      .game-layout { grid-template-columns: 170px minmax(390px, 472px) 170px; gap: 32px; }
      .intro h1 { font-size: 82px; }
    }
    @media (max-width: 780px) {
      .shell { width: min(100% - 30px, 560px); padding-top: 19px; }
      .top-meta span:first-child { display: none; }
      .game-layout { grid-template-columns: 1fr; gap: 36px; padding: 39px 0 42px; }
      .intro { display: grid; grid-template-columns: 1fr auto; align-items: end; column-gap: 18px; padding-top: 0; }
      .intro .kicker, .intro .tagline, .intro .intro-copy, .intro .intro-rule { grid-column: 1; }
      .intro h1 { grid-column: 1 / -1; font-size: clamp(78px, 23vw, 120px); }
      .intro .tagline { margin-top: 21px; }
      .intro-copy { max-width: 230px; }
      .intro-rule { margin-top: 25px; }
      .side-panel { display: grid; grid-template-columns: 1fr 1fr; column-gap: 22px; padding-top: 0; }
      .side-panel > .panel-kicker { grid-column: 1 / -1; margin-bottom: 13px; }
      .target-line { padding-bottom: 15px; }
      .progress-block { padding: 0 0 17px; border-bottom: 1px solid var(--line); }
      .streak { padding: 17px 0 0; border-bottom: 0; }
      .collection { grid-column: 1 / -1; padding-top: 4px; }
      .collection-title { margin-bottom: 9px; }
      .footer-line { padding-top: 17px; }
    }
    @media (max-width: 450px) {
      .shell { width: calc(100% - 24px); }
      .top-meta { gap: 10px; }
      .hud { align-items: flex-end; }
      .score-box { min-width: 84px; padding: 10px 11px 9px; }
      .score-value { font-size: 20px; }
      .restart-btn { padding: 0 10px; }
      .board { box-shadow: 7px 8px 0 #c8cec4; }
      .board-note { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a class="brand" href="#game" aria-label="2048 POP 首页">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>2048 POP</span>
      </a>
      <div class="top-meta" aria-label="游戏信息"><span>合合乐</span><span>经典 4 × 4</span></div>
    </header>

    <main class="game-layout" id="game">
      <section class="intro" aria-labelledby="game-title">
        <p class="kicker">Play / 01</p>
        <h1 id="game-title"><span>20</span><span>48</span></h1>
        <p class="tagline">再合一下。</p>
        <p class="intro-copy">每一次并拢，都会离下一个大数字更近一点。</p>
        <div class="intro-rule" aria-hidden="true"></div>
      </section>

      <section class="play-column" aria-label="2048 游戏区">
        <div class="hud">
          <div class="score-group">
            <div class="score-box">
              <span class="score-label">Score</span>
              <strong class="score-value" id="score">0</strong>
              <span class="gain" id="gain" aria-live="polite"></span>
            </div>
            <div class="score-box best">
              <span class="score-label">Best</span>
              <strong class="score-value" id="best">0</strong>
            </div>
          </div>
          <div class="controls">
            <button class="icon-btn" id="undo" type="button" title="撤销上一步" aria-label="撤销上一步" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-1"></path></svg>
            </button>
            <button class="icon-btn" id="sound" type="button" title="打开声音" aria-label="打开声音">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
            </button>
            <button class="restart-btn" id="restart" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-14.8-3L3 11"></path><path d="M3 5v6h6"></path><path d="M4 13a8.1 8.1 0 0 0 14.8 3L21 13"></path><path d="M21 19v-6h-6"></path></svg>
              <span>新开一局</span>
            </button>
          </div>
        </div>

        <div class="board-wrap">
          <div class="board" id="board" role="application" aria-label="2048 棋盘，使用方向键或滑动移动方块">
            <div class="grid" id="grid" aria-hidden="true"></div>
            <div class="tile-layer" id="tiles" aria-live="polite"></div>
            <div class="overlay" id="overlay" hidden>
              <div class="overlay-card">
                <div class="overlay-mark" aria-hidden="true"></div>
                <h2 id="overlay-title">漂亮！</h2>
                <p id="overlay-copy">这一局还可以继续。</p>
                <div class="overlay-actions">
                  <button class="primary" id="overlay-primary" type="button">继续挑战</button>
                  <button class="secondary" id="overlay-secondary" type="button">重新开始</button>
                </div>
              </div>
            </div>
          </div>
          <div class="board-note">
            <span><i class="status-dot"></i><strong id="status">准备好了</strong></span>
            <span>方向键 · WASD · 滑动</span>
          </div>
        </div>
      </section>

      <aside class="side-panel" aria-label="进度与收藏">
        <p class="panel-kicker">Next milestone</p>
        <div class="target-line">
          <div class="target-tile">2048</div>
          <div class="target-copy"><strong>终点方块</strong><span id="target-copy">还在路上</span></div>
        </div>
        <div class="progress-block">
          <div class="progress-head"><strong>进度</strong><span id="progress-label">0 / 2048</span></div>
          <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
        </div>
        <div class="streak">
          <div class="streak-row"><span class="streak-label">连续合成</span><strong class="streak-value" id="streak">0</strong></div>
          <div class="streak-bar" id="streak-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="collection">
          <div class="collection-title"><strong>方块收藏</strong><span id="collection-count">0 / 12</span></div>
          <div class="milestones" id="milestones" aria-label="已解锁方块"></div>
        </div>
      </aside>
    </main>

    <footer class="footer-line"><span>KEEP IT MOVING / 2026</span><span>本地自动保存 · 不需要联网</span></footer>
  </div>

  <!-- Adapted from the original 2048 engine by Gabriele Cirulli, MIT licensed. -->
  <script>
    (() => {
      'use strict';

      const SIZE = 4;
      const WIN_VALUE = 2048;
      const STORAGE_KEY = '2048-pop-save-v1';
      const BEST_KEY = '2048-pop-best-v1';
      const milestones = [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096];
      const vectors = [{ x: 0, y: -1 }, { x: 1, y: 0 }, { x: 0, y: 1 }, { x: -1, y: 0 }];
      const directionNames = ['上移', '右移', '下移', '左移'];

      let nextTileId = 1;
      let game;
      let audioContext;

      class Tile {
        constructor(position, value, id) {
          this.x = position.x;
          this.y = position.y;
          this.value = value || 2;
          this.id = id || nextTileId++;
          this.previousPosition = null;
          this.mergedFrom = null;
        }
        savePosition() { this.previousPosition = { x: this.x, y: this.y }; }
        updatePosition(position) { this.x = position.x; this.y = position.y; }
        serialize() { return { position: { x: this.x, y: this.y }, value: this.value, id: this.id }; }
      }

      class Grid {
        constructor(size, state) { this.size = size; this.cells = state ? this.fromState(state) : this.empty(); }
        empty() { return Array.from({ length: this.size }, () => Array(this.size).fill(null)); }
        fromState(state) {
          return state.map(column => column.map(data => data ? new Tile(data.position, data.value, data.id) : null));
        }
        eachCell(callback) { for (let x = 0; x < this.size; x++) for (let y = 0; y < this.size; y++) callback(x, y, this.cells[x][y]); }
        availableCells() { const cells = []; this.eachCell((x, y, tile) => { if (!tile) cells.push({ x, y }); }); return cells; }
        cellsAvailable() { return this.availableCells().length > 0; }
        randomAvailableCell() { const cells = this.availableCells(); return cells[Math.floor(Math.random() * cells.length)]; }
        withinBounds(position) { return position.x >= 0 && position.x < this.size && position.y >= 0 && position.y < this.size; }
        cellContent(position) { return this.withinBounds(position) ? this.cells[position.x][position.y] : null; }
        cellAvailable(position) { return !this.cellContent(position); }
        insertTile(tile) { this.cells[tile.x][tile.y] = tile; }
        removeTile(tile) { this.cells[tile.x][tile.y] = null; }
        serialize() { return this.cells.map(column => column.map(tile => tile ? tile.serialize() : null)); }
      }

      class GameManager {
        constructor() { this.history = []; this.setup(); }
        setup(state) {
          if (state) {
            nextTileId = Math.max(nextTileId, state.maxTileId + 1);
            this.grid = new Grid(SIZE, state.grid);
            this.score = state.score;
            this.over = state.over;
            this.won = state.won;
            this.keepPlaying = state.keepPlaying;
            this.combo = state.combo || 0;
            this.unlocked = state.unlocked || [2];
          } else {
            this.grid = new Grid(SIZE);
            this.score = 0;
            this.over = false;
            this.won = false;
            this.keepPlaying = false;
            this.combo = 0;
            this.unlocked = [2];
            this.addRandomTile();
            this.addRandomTile();
          }
          this.lastMove = null;
          this.persist();
        }
        restart() { this.history = []; this.setup(); hideOverlay(); render(); setStatus('准备好了'); }
        keepPlaying() { this.keepPlaying = true; hideOverlay(); this.persist(); render(); }
        serialize() {
          let maxId = 0;
          this.grid.eachCell((x, y, tile) => { if (tile) maxId = Math.max(maxId, tile.id); });
          return { grid: this.grid.serialize(), score: this.score, over: this.over, won: this.won, keepPlaying: this.keepPlaying, combo: this.combo, unlocked: this.unlocked, maxTileId: maxId };
        }
        snapshot() { return JSON.parse(JSON.stringify(this.serialize())); }
        restore(state) { this.setup(state); this.lastMove = null; hideOverlay(); render(); setStatus('已撤销一步'); }
        persist() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(this.serialize()));
            if (this.score > Number(localStorage.getItem(BEST_KEY) || 0)) localStorage.setItem(BEST_KEY, String(this.score));
          } catch (_) {}
        }
        addRandomTile() {
          if (!this.grid.cellsAvailable()) return;
          const value = Math.random() < .9 ? 2 : 4;
          this.grid.insertTile(new Tile(this.grid.randomAvailableCell(), value));
        }
        prepareTiles() { this.grid.eachCell((x, y, tile) => { if (tile) { tile.mergedFrom = null; tile.savePosition(); } }); }
        getVector(direction) { return vectors[direction]; }
        buildTraversals(vector) {
          const x = [0, 1, 2, 3];
          const y = [0, 1, 2, 3];
          if (vector.x === 1) x.reverse();
          if (vector.y === 1) y.reverse();
          return { x, y };
        }
        positionsEqual(a, b) { return a.x === b.x && a.y === b.y; }
        moveTile(tile, cell) { this.grid.cells[tile.x][tile.y] = null; this.grid.cells[cell.x][cell.y] = tile; tile.updatePosition(cell); }
        findFarthestPosition(cell, vector) {
          let previous;
          do { previous = cell; cell = { x: previous.x + vector.x, y: previous.y + vector.y }; } while (this.grid.withinBounds(cell) && this.grid.cellAvailable(cell));
          return { farthest: previous, next: cell };
        }
        tileMatchesAvailable() {
          for (let x = 0; x < SIZE; x++) for (let y = 0; y < SIZE; y++) {
            const tile = this.grid.cellContent({ x, y });
            if (!tile) continue;
            for (const vector of vectors) { const other = this.grid.cellContent({ x: x + vector.x, y: y + vector.y }); if (other && other.value === tile.value) return true; }
          }
          return false;
        }
        movesAvailable() { return this.grid.cellsAvailable() || this.tileMatchesAvailable(); }
        move(direction) {
          if (this.over || (this.won && !this.keepPlaying)) return;
          const vector = this.getVector(direction);
          const traversals = this.buildTraversals(vector);
          let moved = false;
          let mergeTotal = 0;
          const before = this.snapshot();
          this.prepareTiles();
          traversals.x.forEach(x => traversals.y.forEach(y => {
            const cell = { x, y };
            const tile = this.grid.cellContent(cell);
            if (!tile) return;
            const positions = this.findFarthestPosition(cell, vector);
            const next = this.grid.cellContent(positions.next);
            if (next && next.value === tile.value && !next.mergedFrom) {
              const merged = new Tile(positions.next, tile.value * 2);
              merged.mergedFrom = [tile, next];
              this.grid.insertTile(merged);
              this.grid.removeTile(tile);
              tile.updatePosition(positions.next);
              this.score += merged.value;
              mergeTotal += merged.value;
              if (!this.unlocked.includes(merged.value)) this.unlocked.push(merged.value);
              if (merged.value >= WIN_VALUE) this.won = true;
            } else {
              this.moveTile(tile, positions.farthest);
            }
            if (!this.positionsEqual(cell, tile)) moved = true;
          }));
          if (!moved) return;
          this.history.push(before);
          if (this.history.length > 30) this.history.shift();
          this.addRandomTile();
          if (!this.movesAvailable()) this.over = true;
          this.combo = mergeTotal ? Math.min(this.combo + 1, 5) : 0;
          this.lastMove = { direction, mergeTotal, merged: mergeTotal > 0 };
          this.persist();
          render();
          if (mergeTotal) { showGain(mergeTotal); playTone(mergeTotal >= 128 ? 'big' : 'merge'); setStatus(`${directionNames[direction]} · 合成 +${mergeTotal}`); }
          else setStatus(`${directionNames[direction]} · 继续找空位`);
          if (this.won && !this.keepPlaying) showOverlay('漂亮！', '你拿到了 2048。', '继续挑战', '再来一局');
          else if (this.over) showOverlay('棋盘满了', '这局走到这里，已经很接近了。', '再试一次', '关闭');
        }
        undo() { if (!this.history.length) return; const previous = this.history.pop(); this.restore(previous); }
      }

      const $ = selector => document.querySelector(selector);
      const board = $('#board');
      const tilesEl = $('#tiles');
      const gridEl = $('#grid');
      const scoreEl = $('#score');
      const bestEl = $('#best');
      const statusEl = $('#status');
      const overlay = $('#overlay');
      const milestonesEl = $('#milestones');
      const saved = readSave();
      game = new GameManager();
      if (saved) game.setup(saved);

      for (let i = 0; i < 16; i++) { const cell = document.createElement('div'); cell.className = 'cell'; gridEl.appendChild(cell); }
      milestonesEl.innerHTML = milestones.map(value => `<span class="milestone" data-milestone="${value}">${value}</span>`).join('');

      function readSave() {
        try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch (_) { return null; }
      }
      function bestScore() { try { return Number(localStorage.getItem(BEST_KEY) || 0); } catch (_) { return 0; } }
      function formatNumber(value) { return Number(value).toLocaleString('en-US'); }
      function render() {
        const currentIds = new Set();
        game.grid.eachCell((x, y, tile) => {
          if (!tile) return;
          currentIds.add(String(tile.id));
          let el = tilesEl.querySelector(`[data-id="${tile.id}"]`);
          const isNew = !el;
          if (!el) { el = document.createElement('div'); el.dataset.id = tile.id; tilesEl.appendChild(el); }
          el.className = 'tile' + (isNew ? ' tile--new' : '') + (tile.mergedFrom ? ' tile--merged' : '');
          el.dataset.value = tile.value;
          el.style.setProperty('--x', tile.x);
          el.style.setProperty('--y', tile.y);
          el.textContent = tile.value;
          el.setAttribute('aria-label', `${tile.value} 方块`);
          if (tile.mergedFrom) setTimeout(() => el.classList.remove('tile--merged'), 240);
        });
        [...tilesEl.children].forEach(el => { if (!currentIds.has(el.dataset.id)) el.remove(); });
        scoreEl.textContent = formatNumber(game.score);
        bestEl.textContent = formatNumber(bestScore());
        $('#undo').disabled = game.history.length === 0;
        const highest = highestTile();
        const progress = Math.min(100, Math.max(0, Math.log2(highest) / 11 * 100));
        $('#progress').style.width = `${progress}%`;
        $('#progress-label').textContent = `${formatNumber(highest)} / 2,048`;
        $('#target-copy').textContent = highest >= WIN_VALUE ? '已经解锁' : `${formatNumber(highest)} 正在靠近`;
        $('#streak').textContent = game.combo;
        [...$('#streak-bar').children].forEach((item, index) => item.classList.toggle('on', index < game.combo));
        $('#collection-count').textContent = `${game.unlocked.filter(value => milestones.includes(value)).length} / ${milestones.length}`;
        milestones.forEach(value => {
          const item = milestonesEl.querySelector(`[data-milestone="${value}"]`);
          item.classList.toggle('unlocked', game.unlocked.includes(value));
          item.classList.toggle('current', value === highest && value !== WIN_VALUE);
        });
      }
      function highestTile() { let highest = 0; game.grid.eachCell((x, y, tile) => { if (tile) highest = Math.max(highest, tile.value); }); return highest || 2; }
      function setStatus(text) { statusEl.textContent = text; }
      function showGain(value) { const el = $('#gain'); el.textContent = `+${formatNumber(value)}`; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
      function showOverlay(title, copy, primary, secondary) { $('#overlay-title').textContent = title; $('#overlay-copy').textContent = copy; $('#overlay-primary').textContent = primary; $('#overlay-secondary').textContent = secondary; overlay.hidden = false; }
      function hideOverlay() { overlay.hidden = true; }
      function playTone(kind) {
        if (!soundEnabled) return;
        try {
          audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioContext.createOscillator(); const gain = audioContext.createGain();
          osc.type = 'sine'; osc.frequency.value = kind === 'big' ? 620 : 420;
          gain.gain.setValueAtTime(.0001, audioContext.currentTime); gain.gain.exponentialRampToValueAtTime(kind === 'big' ? .12 : .07, audioContext.currentTime + .012); gain.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + .15);
          osc.connect(gain); gain.connect(audioContext.destination); osc.start(); osc.stop(audioContext.currentTime + .16);
        } catch (_) {}
      }

      let soundEnabled = false;
      $('#restart').addEventListener('click', () => game.restart());
      $('#undo').addEventListener('click', () => game.undo());
      $('#sound').addEventListener('click', event => {
        soundEnabled = !soundEnabled;
        event.currentTarget.setAttribute('aria-label', soundEnabled ? '关闭声音' : '打开声音');
        event.currentTarget.setAttribute('title', soundEnabled ? '关闭声音' : '打开声音');
        event.currentTarget.innerHTML = soundEnabled
          ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="m19 9-5 6"></path><path d="m14 9 5 6"></path></svg>'
          : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>';
        if (soundEnabled) playTone('merge');
      });
      $('#overlay-primary').addEventListener('click', () => game.won && !game.over ? game.keepPlaying() : game.restart());
      $('#overlay-secondary').addEventListener('click', () => game.restart());
      document.addEventListener('keydown', event => {
        const keys = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3, W: 0, D: 1, S: 2, A: 3 };
        if (event.key in keys) { event.preventDefault(); game.move(keys[event.key]); }
        if ((event.key === 'z' || event.key === 'Z') && (event.ctrlKey || event.metaKey)) { event.preventDefault(); game.undo(); }
      });
      let touchStart = null;
      board.addEventListener('touchstart', event => { const touch = event.changedTouches[0]; touchStart = { x: touch.clientX, y: touch.clientY }; }, { passive: true });
      board.addEventListener('touchend', event => {
        if (!touchStart) return;
        const touch = event.changedTouches[0]; const dx = touch.clientX - touchStart.x; const dy = touch.clientY - touchStart.y; touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
        game.move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
      }, { passive: true });

      render();
    })();
  </script>
</body>
</html>
