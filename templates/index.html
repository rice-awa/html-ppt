<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 演示文稿集合</title>
<meta name="description" content="网络协议与技术主题的 HTML 演示文稿合集">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08080b;
    --bg-elevated: #0f0f14;
    --border: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(255, 255, 255, 0.18);
    --text-primary: #f2f2f6;
    --text-secondary: #8b8b98;
    --text-tertiary: #4d4d57;
    --accent: #3d6bff;
    --accent-soft: rgba(61, 107, 255, 0.14);
    --accent-glow: rgba(61, 107, 255, 0.35);
    --amber: #f6c445;
    --radius-lg: 16px;
    --radius-sm: 8px;
    --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", Arial, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { color-scheme: dark; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-body);
    line-height: 1.5;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* ambient backdrop: faint grid + radial glow, no loud gradients */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse 80% 55% at 50% 0%, #000 0%, transparent 70%);
    mask-image: radial-gradient(ellipse 80% 55% at 50% 0%, #000 0%, transparent 70%);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: "";
    position: fixed;
    top: -20%;
    left: 50%;
    width: 900px;
    height: 700px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, var(--accent-soft), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: clamp(64px, 12vw, 128px) 24px 80px;
  }

  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
    opacity: 0;
    animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .kicker::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.4rem, 6vw, 4rem);
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--text-primary);
    margin-bottom: 20px;
    opacity: 0;
    animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.08s forwards;
  }

  .subtitle {
    font-size: clamp(0.95rem, 1.5vw, 1.05rem);
    color: var(--text-secondary);
    max-width: 46ch;
    margin-bottom: 40px;
    opacity: 0;
    animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.16s forwards;
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 40px;
    margin-bottom: 40px;
    border-bottom: 1px solid var(--border);
    opacity: 0;
    animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.24s forwards;
  }

  .meta-chip {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
  }

  .deck-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .deck-card {
    display: block;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    text-decoration: none;
    color: inherit;
    position: relative;
    overflow: hidden;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                border-color 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 0;
    animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: calc(0.3s + var(--i) * 0.07s);
  }

  .deck-card:hover,
  .deck-card:focus-visible {
    transform: translateY(-3px);
    border-color: var(--border-hover);
    box-shadow: 0 16px 40px -20px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--accent-soft);
  }

  .deck-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .deck-thumb {
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .deck-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), object-fit 0.35s ease;
  }

  .deck-card:hover .deck-thumb img {
    transform: scale(1.03);
  }

  @media (hover: hover) and (pointer: fine) {
    .deck-card:hover .deck-thumb img {
      object-fit: contain;
      transform: scale(1);
    }
  }

  .deck-thumb-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, hsl(calc(var(--i) * 60), 60%, 20%), hsl(calc(var(--i) * 60 + 40), 50%, 12%));
  }

  .deck-thumb-placeholder span {
    font-family: var(--font-display);
    font-size: 2.4rem;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.18);
    text-transform: uppercase;
  }

  .deck-index {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-tertiary);
    letter-spacing: 0.04em;
    transition: color 0.35s ease;
  }

  .deck-card:hover .deck-index { color: var(--accent); }

  .deck-body {
    padding: 18px 20px 8px;
  }

  .deck-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.1rem;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
    text-wrap: pretty;
  }

  .deck-desc {
    font-size: 0.92rem;
    color: var(--text-secondary);
    text-wrap: pretty;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .deck-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px 20px;
  }

  .deck-route {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-secondary);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 5px 10px;
    white-space: nowrap;
    margin-left: auto;
  }

  .deck-arrow {
    color: var(--text-tertiary);
    font-size: 18px;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), color 0.35s ease;
  }

  .deck-card:hover .deck-arrow {
    transform: translateX(4px);
    color: var(--accent);
  }

  .empty-state {
    padding: 64px 28px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: var(--radius-lg);
    color: var(--text-secondary);
    font-size: 0.95rem;
  }

  .empty-state code {
    font-family: var(--font-mono);
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 6px;
    border-radius: 4px;
  }

  footer {
    max-width: 1200px;
    margin: 64px auto 0;
    padding: 24px;
    text-align: center;
  }

  footer p {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--text-tertiary);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .kicker, h1, .subtitle, .meta-row, .deck-card {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }

  @media (max-width: 1023px) {
    .deck-list {
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
  }

  @media (max-width: 640px) {
    .deck-list {
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .deck-body { padding: 18px 22px 8px; }
    .deck-meta { padding: 0 22px 18px; }
    .deck-thumb-placeholder span { font-size: 2rem; }
  }
</style>
</head>
<body>
  <div class="page">
    <span class="kicker">Presentation Library</span>
    <h1>HTML 演示文稿集合</h1>
    <p class="subtitle">网络协议与技术主题的演示文稿合集，点击卡片即可查看完整幻灯片。</p>
    <div class="meta-row">
      <span class="meta-chip">{{COUNT}} 篇演示文稿</span>
      <span class="meta-chip">由 build.js 构建</span>
    </div>
    <div class="deck-list">
{{CARDS}}
    </div>
  </div>
  <footer>
    <p>HTMLPPT · Powered by Vercel</p>
  </footer>
</body>
</html>
