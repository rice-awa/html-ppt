<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 演示文稿集合 | Project Showcase</title>
<meta name="description" content="网络协议与技术主题的 HTML 演示文稿合集">
<meta name="theme-color" content="#050609">
<link rel="icon" href="data:,">
<script>document.documentElement.classList.add('js');</script>

<style>
  :root {
    color-scheme: dark;
    --bg: #050609;
    --surface: rgba(15, 18, 24, 0.74);
    --surface-mobile: rgba(14, 17, 23, 0.96);
    --surface-strong: #151920;
    --border: rgba(255, 255, 255, 0.1);
    --border-hover: rgba(88, 132, 255, 0.62);
    --text-primary: #f7f8fb;
    --text-secondary: #afb4c0;
    --text-tertiary: #737987;
    --accent: #5884ff;
    --signal: #55d3a3;
    --radius: 8px;
    --font-display: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }

  * {
    box-sizing: border-box;
  }

  html {
    background: var(--bg);
  }

  body {
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-display);
    line-height: 1.6;
    text-rendering: optimizeLegibility;
  }

  #vanta-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      var(--bg);
    background-size: 64px 64px, 64px 64px, auto;
  }

  .page,
  footer {
    position: relative;
    z-index: 1;
  }

  .page {
    width: min(100%, 1280px);
    margin: 0 auto;
    padding: 96px 24px 72px;
  }

  .hero-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 64px;
    text-align: center;
  }

  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    padding: 7px 12px;
    border: 1px solid rgba(85, 211, 163, 0.28);
    border-radius: 999px;
    background: rgba(9, 24, 20, 0.78);
    color: var(--signal);
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.2;
    text-transform: uppercase;
  }

  .kicker::before {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 14px rgba(85, 211, 163, 0.58);
    content: "";
  }

  h1 {
    max-width: 920px;
    margin: 0 0 22px;
    font-size: 64px;
    font-weight: 760;
    line-height: 1.08;
    letter-spacing: 0;
  }

  .subtitle {
    max-width: 620px;
    margin: 0 0 32px;
    color: var(--text-secondary);
    font-size: 18px;
    line-height: 1.75;
  }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .meta-chip {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(16, 19, 25, 0.84);
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.2;
  }

  .deck-list {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .deck-card {
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: 0 16px 44px rgba(0, 0, 0, 0.18);
    color: inherit;
    text-decoration: none;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }

  .js .deck-card {
    opacity: 0;
    transform: translateY(18px);
  }

  .js .deck-card.is-visible {
    opacity: 1;
    transform: translateY(0);
    transition:
      opacity 560ms cubic-bezier(0.22, 1, 0.36, 1),
      transform 560ms cubic-bezier(0.22, 1, 0.36, 1),
      border-color 220ms ease,
      box-shadow 220ms ease;
  }

  .js .deck-card:not(.is-visible) {
    will-change: opacity, transform;
  }

  .deck-thumb {
    position: relative;
    overflow: hidden;
    aspect-ratio: 16 / 9;
    border-bottom: 1px solid var(--border);
    background: #090b10;
  }

  .deck-thumb img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .deck-thumb-placeholder {
    display: grid;
    height: auto;
    place-items: center;
    background: var(--surface-strong);
  }

  .deck-thumb-placeholder span {
    color: rgba(255, 255, 255, 0.12);
    font-size: 48px;
    font-weight: 700;
  }

  .deck-body {
    padding: 20px 22px 12px;
  }

  .deck-title {
    margin: 0 0 8px;
    overflow-wrap: anywhere;
    font-size: 20px;
    font-weight: 680;
    line-height: 1.35;
    letter-spacing: 0;
    transition: color 180ms ease;
  }

  .deck-desc {
    display: -webkit-box;
    margin: 0;
    overflow: hidden;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.65;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  .deck-meta {
    display: flex;
    min-width: 0;
    align-items: center;
    gap: 10px;
    padding: 0 22px 20px;
  }

  .deck-index,
  .deck-route {
    font-family: var(--font-mono);
    font-size: 11px;
  }

  .deck-index {
    flex: 0 0 auto;
    color: var(--signal);
  }

  .deck-route {
    min-width: 0;
    overflow: hidden;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-secondary);
    line-height: 1.2;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .deck-arrow {
    display: grid;
    flex: 0 0 30px;
    width: 30px;
    height: 30px;
    margin-left: auto;
    place-items: center;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-primary);
    font-size: 16px;
    line-height: 1;
    transition:
      background-color 180ms ease,
      border-color 180ms ease,
      color 180ms ease;
  }

  .deck-card:focus-visible {
    outline: 3px solid rgba(88, 132, 255, 0.8);
    outline-offset: 4px;
  }

  footer {
    width: min(calc(100% - 48px), 1232px);
    margin: 0 auto;
    padding: 28px 0 36px;
    border-top: 1px solid var(--border);
    text-align: center;
  }

  footer p {
    margin: 0;
    color: var(--text-tertiary);
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.6;
  }

  .empty-state {
    padding: 48px 24px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-mobile);
    color: var(--text-secondary);
    text-align: center;
  }

  .empty-state code {
    color: var(--signal);
    font-family: var(--font-mono);
  }

  @media (hover: hover) and (pointer: fine) {
    .deck-card.is-visible:hover {
      transform: translateY(-4px);
      border-color: var(--border-hover);
      box-shadow: 0 22px 54px rgba(0, 0, 0, 0.28);
    }

    .deck-card:hover .deck-thumb img {
      transform: scale(1.025);
    }

    .deck-card:hover .deck-title {
      color: #86a5ff;
    }

    .deck-card:hover .deck-arrow {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
  }

  @media (min-width: 1100px) {
    .deck-list {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
  }

  @media (min-width: 680px) and (max-width: 1099px) {
    .page {
      padding-top: 80px;
    }

    h1 {
      font-size: 48px;
    }

    .deck-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 679px) {
    .page {
      padding: 56px 16px 52px;
    }

    .hero-section {
      align-items: flex-start;
      margin-bottom: 42px;
      text-align: left;
    }

    .kicker {
      margin-bottom: 18px;
    }

    h1 {
      max-width: 10em;
      margin-bottom: 18px;
      font-size: 38px;
      line-height: 1.12;
    }

    .subtitle {
      margin-bottom: 24px;
      font-size: 16px;
      line-height: 1.7;
    }

    .meta-row {
      justify-content: flex-start;
    }

    .deck-list {
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .deck-body {
      padding: 18px 18px 10px;
    }

    .deck-title {
      font-size: 19px;
    }

    .deck-meta {
      padding: 0 18px 18px;
    }

    footer {
      width: calc(100% - 32px);
    }
  }

  @media (hover: none), (pointer: coarse), (max-width: 679px) {
    .deck-card {
      background: var(--surface-mobile);
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }

    .deck-thumb img {
      transition: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }

    .js .deck-card,
    .js .deck-card.is-visible {
      opacity: 1;
      transform: none;
      will-change: auto;
    }
  }
</style>
</head>
<body>
  <div id="vanta-bg" aria-hidden="true"></div>

  <main class="page">
    <header class="hero-section">
      <span class="kicker">Presentation Library</span>
      <h1>HTML 演示文稿集合</h1>
      <p class="subtitle">深入探索网络协议与前沿技术。呈现为交互式幻灯片，提供沉浸式的阅读与演示体验。</p>
      <div class="meta-row">
        <span class="meta-chip">{{COUNT}} 篇精选文稿</span>
        <span class="meta-chip">Powered by build.js</span>
      </div>
    </header>

    <section class="deck-list" aria-label="演示文稿列表">
      {{CARDS}}
    </section>
  </main>

  <footer>
    <p>HTMLPPT · Crafted for Excellence · Powered by Vercel</p>
  </footer>

  <script>
    const cards = [...document.querySelectorAll('.deck-card')];
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduceMotion || !('IntersectionObserver' in window)) {
      cards.forEach((card) => card.classList.add('is-visible'));
    } else {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          const card = entry.target;
          card.classList.add('is-visible');
          observer.unobserve(card);
        });
      }, {
        rootMargin: '0px 0px -6% 0px',
        threshold: 0.08
      });

      cards.forEach((card) => observer.observe(card));
    }

    let vantaEffect = null;
    const THREE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js';
    const VANTA_URL = 'https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.net.min.js';

    const loadScript = (src) => new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.async = true;
      script.addEventListener('load', resolve, { once: true });
      script.addEventListener('error', reject, { once: true });
      document.head.append(script);
    });

    const initVanta = () => {
      if (vantaEffect || !window.VANTA?.NET) return;

      vantaEffect = window.VANTA.NET({
        el: '#vanta-bg',
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200,
        minWidth: 200,
        scale: 1,
        scaleMobile: 1,
        color: 0x3d6bff,
        backgroundColor: 0x050609,
        points: 12,
        maxDistance: 22,
        spacing: 18,
        showDots: true
      });
    };

    const loadVanta = async () => {
      if (!window.THREE) await loadScript(THREE_URL);
      if (!window.VANTA?.NET) await loadScript(VANTA_URL);
      initVanta();
    };

    const scheduleVanta = () => {
      const start = () => loadVanta().catch(() => {});
      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(start, { timeout: 1200 });
      } else {
        window.setTimeout(start, 1);
      }
    };

    window.addEventListener('load', scheduleVanta, { once: true });
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) scheduleVanta();
    });
    window.addEventListener('pagehide', () => {
      if (!vantaEffect) return;
      vantaEffect.destroy();
      vantaEffect = null;
    });
  </script>
</body>
</html>
