<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 演示文稿集合 | Project Showcase</title>
<meta name="description" content="网络协议与技术主题的 HTML 演示文稿合集">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- 引入动画与时差滚动库 -->
<script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>

<style>
  :root {
    --bg: #030305;
    --bg-elevated: rgba(15, 15, 20, 0.4);
    --border: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(61, 107, 255, 0.4);
    --text-primary: #ffffff;
    --text-secondary: #a0a0ab;
    --text-tertiary: #5e5e69;
    --accent: #3d6bff;
    --accent-glow: rgba(61, 107, 255, 0.6);
    --radius-lg: 20px;
    --radius-sm: 8px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; /* 使用自定义鼠标 */ }

  html { color-scheme: dark; scroll-behavior: initial; } /* Lenis 需要 initial */

  body {
    background: transparent;
    color: var(--text-primary);
    font-family: var(--font-body);
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 自定义光标 */
  .cursor-dot, .cursor-outline {
    position: fixed;
    top: 0; left: 0;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    z-index: 9999;
    pointer-events: none;
  }
  .cursor-dot {
    width: 8px; height: 8px;
    background-color: var(--accent);
  }
  .cursor-outline {
    width: 40px; height: 40px;
    border: 1px solid rgba(61, 107, 255, 0.5);
    transition: width 0.2s, height 0.2s, background-color 0.2s;
  }

  /* 动态背景容器（CSS 兜底：当 Vanta 初始化失败或未启用 WebGL 时仍保持暗色与网格质感） */
  #vanta-bg {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(61, 107, 255, 0.12), transparent 70%),
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      var(--bg);
    background-size: 100% 100%, 64px 64px, 64px 64px, 100% 100%;
    pointer-events: none;
  }

  /* 顶部渐变遮罩 */
  .bg-gradient {
    position: fixed;
    top: -20%; left: 50%;
    width: 1000px; height: 800px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(61, 107, 255, 0.15) 0%, transparent 70%);
    z-index: 1;
    pointer-events: none;
  }

  .page {
    position: relative;
    z-index: 2;
    max-width: 1300px;
    margin: 0 auto;
    padding: clamp(100px, 15vw, 180px) 32px 100px;
  }

  .hero-section {
    text-align: center;
    margin-bottom: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 24px;
    padding: 8px 16px;
    border-radius: 100px;
    border: 1px solid rgba(61, 107, 255, 0.2);
    background: rgba(61, 107, 255, 0.05);
    backdrop-filter: blur(10px);
  }

  .kicker::before {
    content: ""; width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 16px var(--accent-glow);
    animation: pulse 2s infinite;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(3rem, 8vw, 5.5rem);
    letter-spacing: -0.03em;
    line-height: 1.05;
    margin-bottom: 30px;
    background: linear-gradient(180deg, #fff 0%, #a0a0ab 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: clamp(1.1rem, 2vw, 1.25rem);
    color: var(--text-secondary);
    max-width: 60ch;
    margin: 0 auto 50px;
    font-weight: 300;
  }

  .meta-row {
    display: flex;
    justify-content: center;
    gap: 16px;
  }

  .meta-chip {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 20px;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
  }
  
  .meta-chip:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--text-secondary);
  }

  /* 瀑布流/网格布局 */
  .deck-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 32px;
    perspective: 1000px; /* 为3D效果准备 */
  }

  .deck-card {
    display: block;
    background: var(--bg-elevated);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    text-decoration: none;
    color: inherit;
    position: relative;
    overflow: hidden;
    transform-style: preserve-3d;
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
  }

  /* 毛玻璃反光特效 */
  .deck-card::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.05), transparent);
    transform: skewX(-20deg);
    transition: 0.5s;
    z-index: 2;
    pointer-events: none;
  }

  .deck-card:hover::before {
    left: 150%;
  }

  .deck-card:hover {
    border-color: var(--border-hover);
    box-shadow: 0 20px 50px -20px rgba(61, 107, 255, 0.3), 
                inset 0 0 0 1px rgba(61, 107, 255, 0.2);
  }

  .deck-thumb {
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #000;
    border-bottom: 1px solid var(--border);
    position: relative;
    transform: translateZ(30px); /* 3D 景深 */
  }

  .deck-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), filter 0.7s;
    filter: grayscale(40%) brightness(0.8);
  }

  .deck-card:hover .deck-thumb img {
    transform: scale(1.08);
    filter: grayscale(0%) brightness(1);
  }

  .deck-thumb-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #121218, #0a0a0f);
    height: 100%;
  }

  .deck-thumb-placeholder span {
    font-family: var(--font-display);
    font-size: 3rem;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.05);
  }

  .deck-body {
    padding: 24px 28px 12px;
    transform: translateZ(20px);
  }

  .deck-index {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-tertiary);
    margin-bottom: 12px;
    display: block;
  }

  .deck-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.3rem;
    margin-bottom: 10px;
    line-height: 1.3;
    transition: color 0.3s;
  }
  
  .deck-card:hover .deck-title {
    color: var(--accent);
  }

  .deck-desc {
    font-size: 0.95rem;
    color: var(--text-secondary);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .deck-meta {
    display: flex;
    align-items: center;
    padding: 0 28px 28px;
    transform: translateZ(20px);
  }

  .deck-route {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-secondary);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
  }

  .deck-arrow {
    margin-left: auto;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s ease;
    border: 1px solid transparent;
  }

  .deck-arrow svg {
    width: 14px; height: 14px;
    fill: none; stroke: currentColor; stroke-width: 2;
    transition: transform 0.3s ease;
  }

  .deck-card:hover .deck-arrow {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent-glow);
    box-shadow: 0 0 15px var(--accent-glow);
  }

  .deck-card:hover .deck-arrow svg {
    transform: translateX(2px) translateY(-2px);
  }

  footer {
    position: relative;
    z-index: 2;
    max-width: 1300px;
    margin: 100px auto 0;
    padding: 40px 32px;
    text-align: center;
    border-top: 1px solid var(--border);
  }

  footer p {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--text-tertiary);
    text-transform: uppercase;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(61, 107, 255, 0.4); }
    70% { box-shadow: 0 0 0 10px rgba(61, 107, 255, 0); }
    100% { box-shadow: 0 0 0 0 rgba(61, 107, 255, 0); }
  }

  /* 进入动画初始状态 */
  .gsap-reveal { opacity: 0; visibility: hidden; }

  @media (max-width: 768px) {
    .deck-list { grid-template-columns: 1fr; }
    * { cursor: auto !important; }
    .cursor-dot, .cursor-outline { display: none; }
  }
</style>
</head>
<body>

  <!-- 自定义鼠标 -->
  <div class="cursor-dot"></div>
  <div class="cursor-outline"></div>

  <!-- Vanta 动态背景 -->
  <div id="vanta-bg"></div>
  <div class="bg-gradient"></div>

  <div class="page">
    <div class="hero-section">
      <span class="kicker gsap-reveal">Presentation Library</span>
      <h1 class="gsap-reveal">HTML 演示文稿集合</h1>
      <p class="subtitle gsap-reveal">深入探索网络协议与前沿技术。呈现为交互式幻灯片，提供沉浸式的阅读与演示体验。</p>
      <div class="meta-row gsap-reveal">
        <span class="meta-chip">{{COUNT}} 篇精选文稿</span>
        <span class="meta-chip">Powered by build.js</span>
      </div>
    </div>
    
    <div class="deck-list">
      <!-- 卡片占位符由外部构建脚本替换 -->
      <!-- 示例卡片结构，确保构建脚本生成的 HTML 能匹配上述 CSS 结构 -->
      {{CARDS}}
    </div>
  </div>

  <footer class="gsap-reveal">
    <p>HTMLPPT · Crafted for Excellence · Powered by Vercel</p>
  </footer>

  <script>
    // 1. 初始化 Lenis 平滑滚动
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smoothWheel: true
    });

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    // 2. 初始化 Vanta.js 科技感连线背景 (与“网络协议”主题呼应)
    window.addEventListener('DOMContentLoaded', () => {
      VANTA.NET({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: 1.00,
        scaleMobile: 1.00,
        color: 0x3d6bff,      // 科技蓝
        backgroundColor: 0x030305, // 深邃黑
        points: 12.00,
        maxDistance: 22.00,
        spacing: 18.00,
        showDots: true
      });
    });

    // 3. 自定义光标跟随
    const cursorDot = document.querySelector('.cursor-dot');
    const cursorOutline = document.querySelector('.cursor-outline');
    
    window.addEventListener('mousemove', (e) => {
      const posX = e.clientX;
      const posY = e.clientY;
      
      cursorDot.style.left = `${posX}px`;
      cursorDot.style.top = `${posY}px`;
      
      // 让外圈有一点延迟跟随
      cursorOutline.animate({
        left: `${posX}px`,
        top: `${posY}px`
      }, { duration: 500, fill: "forwards" });
    });

    // 为可交互元素添加光标悬停状态
    const interactives = document.querySelectorAll('a, button, .deck-card, .meta-chip');
    interactives.forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursorOutline.style.width = '60px';
        cursorOutline.style.height = '60px';
        cursorOutline.style.backgroundColor = 'rgba(61, 107, 255, 0.1)';
      });
      el.addEventListener('mouseleave', () => {
        cursorOutline.style.width = '40px';
        cursorOutline.style.height = '40px';
        cursorOutline.style.backgroundColor = 'transparent';
      });
    });

    // 4. 初始化 Vanilla-tilt (3D 卡片悬停效果)
    // 延迟执行以确保构建脚本已注入卡片
    setTimeout(() => {
      VanillaTilt.init(document.querySelectorAll(".deck-card"), {
        max: 8,
        speed: 400,
        glare: true,
        "max-glare": 0.15,
        perspective: 1000
      });
      
      // 5. GSAP 滚动入场动画
      gsap.registerPlugin(ScrollTrigger);
      
      // 头部元素依次浮现
      gsap.fromTo(".gsap-reveal", 
        { y: 30, opacity: 0, autoAlpha: 0 },
        { y: 0, opacity: 1, autoAlpha: 1, duration: 1, stagger: 0.15, ease: "power3.out", delay: 0.2 }
      );

      // 卡片滚动浮现
      const cards = gsap.utils.toArray('.deck-card');
      if(cards.length > 0) {
        cards.forEach((card, i) => {
          gsap.fromTo(card,
            { y: 50, opacity: 0 },
            {
              scrollTrigger: {
                trigger: card,
                start: "top 85%",
                toggleActions: "play none none reverse"
              },
              y: 0,
              opacity: 1,
              duration: 0.8,
              ease: "power3.out",
              delay: (i % 3) * 0.1 // 简单的级联延迟
            }
          );
        });
      }
    }, 100);
  </script>
</body>
</html>
