<a href="{{ROUTE}}" class="deck-card" style="--i:{{INDEX}}">
  {{THUMB_BLOCK}}
  <div class="deck-body">
    <h2 class="deck-title">{{TITLE}}</h2>
{{DESC_BLOCK}}
  </div>
  <div class="deck-meta">
    <span class="deck-index">{{INDEX_LABEL}}</span>
    <span class="deck-route">{{ROUTE}}</span>
    <span class="deck-arrow" aria-hidden="true">&rarr;</span>
  </div>
</a>
